name: AWS CDK deploy

# Tests run on every PR and push; pushes to main also deploy the site to AWS.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "lambda/**"
      - "infra/**"
      - ".github/workflows/aws-cdk-deploy.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "lambda/**"
      - "infra/**"
      - ".github/workflows/aws-cdk-deploy.yml"
  workflow_dispatch:

# One deploy at a time; never cancel a deploy halfway through.
concurrency:
  group: aws-cdk-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Lambda unit tests
        working-directory: lambda
        run: |
          npm ci
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: CDK unit tests
        working-directory: infra
        run: mvn -B -q test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no stored keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2

      - name: cdk deploy
        working-directory: infra
        # GitHubOidcStack is deliberately excluded: CI must not edit its own trust.
        run: |
          cdk deploy ResumeCertStack ResumeSiteStack \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Smoke test
        working-directory: infra
        run: |
          set -euo pipefail
          url=$(jq -r '.ResumeSiteStack.SiteUrl' cdk-outputs.json)
          echo "Testing $url"
          curl -fsS -o /dev/null -w "home: %{http_code}\n" "$url/"
          count=$(curl -fsS "$url/api/visitorCounter" | jq -r '.count')
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "Counter API returned: $count"; exit 1; }
          echo "visitor count: $count"
          echo "### Deployed to $url (visitor count $count)" >> "$GITHUB_STEP_SUMMARY"
